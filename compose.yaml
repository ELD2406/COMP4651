services:
  kafka-volume-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:0 /var/lib/kafka/data"]
    restart: "no"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-3}"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - target: 29092
        published: "${KAFKA_HOST_PORT:-9092}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - stage1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ingestion:
    image: hm-ingestion:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_S3: "${INSTALL_S3:-false}"
    init: true
    restart: "no"
    environment:
      HM_DATASET_ROOT: "/data"
      HM_TRANSACTIONS_FILE: "/data/transactions_train.csv"
      HM_CUSTOMERS_FILE: "/data/customers.csv"
      HM_ARTICLES_FILE: "/data/articles.csv"
      HM_CHECKPOINT_DIR: "/checkpoints"
      HM_BATCH_SIZE: "${HM_BATCH_SIZE:-5000}"
      HM_CHECKPOINT_EVERY_ROWS: "${HM_CHECKPOINT_EVERY_ROWS:-5000}"
      HM_LOG_LEVEL: "${HM_LOG_LEVEL:-INFO}"
      HM_REPLAY_SPEED: "${HM_REPLAY_SPEED:-0}"
      HM_STORAGE_BACKEND: "${HM_STORAGE_BACKEND:-local}"
      HM_LOCAL_STORAGE_ROOT: "/raw-data"
      HM_S3_MANIFEST_PATH: "/checkpoints/s3-manifest.json"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_S3_PREFIX: "${AWS_S3_PREFIX:-raw}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-fashion.purchase-lines.v1}"
      KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-3}"
      KAFKA_ACKS: "all"
      KAFKA_COMPRESSION_TYPE: "${KAFKA_COMPRESSION_TYPE:-snappy}"
      KAFKA_LINGER_MS: "${KAFKA_LINGER_MS:-20}"
      KAFKA_BATCH_SIZE_BYTES: "${KAFKA_BATCH_SIZE_BYTES:-131072}"
      KAFKA_REQUEST_TIMEOUT_MS: "${KAFKA_REQUEST_TIMEOUT_MS:-30000}"
    volumes:
      - type: bind
        source: "${HM_DATASET_HOST_PATH:-./h-and-m-personalized-fashion-recommendations}"
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - checkpoints:/checkpoints
      - raw-data:/raw-data
      - type: bind
        source: "${DOCKER_CONFIG_FILE:-./config.docker.example.toml}"
        target: /app/config.docker.toml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - stage1
    depends_on:
      kafka:
        condition: service_healthy

networks:
  stage1:
    driver: bridge

volumes:
  kafka-data:
  checkpoints:
  raw-data:
